name: Test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.runner }} ${{ matrix.engine }} ${{ matrix.variant }} ${{ matrix.port }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - ubuntu-26.04
          - ubuntu-26.04-arm
        variant: [latest]
        engine: [docker]
        port: ["9297"]
        include:
          - { runner: ubuntu-24.04, variant: debian, engine: docker, port: "9297" }
          - { runner: ubuntu-24.04-arm, variant: debian, engine: docker, port: "9297" }
          - { runner: ubuntu-24.04, variant: distroless, engine: docker, port: "9297" }
          - { runner: ubuntu-24.04-arm, variant: distroless, engine: docker, port: "9297" }
          - { runner: ubuntu-26.04, variant: distroless, engine: podman, port: "9297" }
          - { runner: ubuntu-24.04, variant: latest, engine: docker, port: "19300" }
          - { runner: ubuntu-24.04, variant: latest, engine: podman, port: "9297" }
          - { runner: ubuntu-26.04, variant: latest, engine: podman, port: "9297" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run AWS Emulator
        id: emulator
        uses: ./
        with:
          image: ghcr.io/xsavikx/aws-emulator:${{ matrix.variant }}
          port: ${{ matrix.port }}
          engine: ${{ matrix.engine }}
          pull: "true"

      - name: Check outputs
        env:
          ENDPOINT: ${{ steps.emulator.outputs.endpoint-url }}
          CA: ${{ steps.emulator.outputs.ca-file }}
          DIGEST: ${{ steps.emulator.outputs.image-digest }}
          PORT: ${{ matrix.port }}
        run: |
          set -euo pipefail
          echo "endpoint=$ENDPOINT ca=$CA digest=$DIGEST"
          test "$ENDPOINT" = "https://127.0.0.1:$PORT"
          test -s "$CA"
          test "$AWS_ENDPOINT_URL" = "$ENDPOINT"
          [[ "$DIGEST" == *@sha256:* ]]

      - name: AWS CLI against the emulator
        run: |
          set -euxo pipefail
          if ! command -v aws >/dev/null; then pipx install awscli >/dev/null 2>&1 || python3 -m pip install --user awscli; fi
          test "$(aws sts get-caller-identity --query Account --output text)" = 000000000000
          aws s3 mb s3://action-test
          echo hello | aws s3 cp - s3://action-test/hello.txt
          test "$(aws s3 cp s3://action-test/hello.txt -)" = hello
          aws dynamodb create-table --table-name action-test \
            --attribute-definitions AttributeName=pk,AttributeType=S \
            --key-schema AttributeName=pk,KeyType=HASH --billing-mode PAY_PER_REQUEST >/dev/null
          aws dynamodb wait table-exists --table-name action-test

      - name: Internet TLS still works with SSL_CERT_FILE and JAVA_TOOL_OPTIONS
        run: |
          set -euo pipefail
          python3 -c "import urllib.request; urllib.request.urlopen('https://pypi.org/simple/', timeout=20); print('python ok')"
          curl -fsS --cacert "$SSL_CERT_FILE" -o /dev/null https://repo.maven.apache.org/maven2/ && echo "curl ok"
          if command -v keytool >/dev/null; then test -n "${JAVA_TOOL_OPTIONS:-}"; fi

      - name: Emulator logs
        if: failure()
        run: ${{ matrix.engine }} logs "aws-emulator-${{ matrix.port }}"

  # Runners without Docker for Linux containers must fail early with a clear message.
  verify:
    name: Verify the image signature (README example)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: emulator
        uses: ./
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - run: |
          cosign verify "${{ steps.emulator.outputs.image-digest }}" \
            --certificate-identity 'https://github.com/xSAVIKx/aws-emulator-docker/.github/workflows/release.yml@refs/heads/main' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            >/dev/null

  unsupported:
    name: ${{ matrix.runner }} fails with a clear message
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, windows-latest, ubuntu-slim]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run AWS Emulator (expected to fail)
        id: emulator
        continue-on-error: true
        uses: ./
      - name: Check that the action failed
        shell: bash
        env:
          OUTCOME: ${{ steps.emulator.outcome }}
        run: |
          echo "outcome=$OUTCOME"
          test "$OUTCOME" = failure

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck start-emulator.sh
      - name: Invalid inputs fail before the start
        run: |
          set -u
          for setting in EMULATOR_WAIT=abc EMULATOR_PORT=0 EMULATOR_PORT=70000 EMULATOR_TELEMETRY=maybe \
            EMULATOR_PULL=yes EMULATOR_ENGINE=nerdctl "EMULATOR_REGION=us-east-1$(printf '\nX=1')"; do
            if env "$setting" ./start-emulator.sh; then echo "no failure for $setting"; exit 1; fi
          done
          if docker ps -a --format '{{.Names}}' | grep -q '^aws-emulator-'; then echo "a container started"; exit 1; fi
